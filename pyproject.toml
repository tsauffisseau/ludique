[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bgg-pipeline"
version = "1.0.0"
description = "BoardGameGeek analytics pipeline: API -> Bronze -> Silver -> PostgreSQL star schema -> clustering -> Streamlit"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Théophile Sauffisseau" }]
license = { text = "MIT" }
dependencies = [
    "requests>=2.32",
    "truststore>=0.9",
    "pandas>=2.2",
    "pyarrow>=16",
    "pydantic>=2.7",
    "psycopg[binary]>=3.2",
    "scikit-learn>=1.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.38", "plotly>=5.22"]
dev = ["pytest>=8.2", "ruff>=0.6"]
aws = ["boto3>=1.34"]

[project.scripts]
bgg-pipeline = "bgg_pipeline.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["learning"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
